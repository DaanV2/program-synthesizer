name: 🚚 Release assets

on:
  release:
    types: [released]

jobs:
  binaries:
    runs-on: ubuntu-latest
    name: 📦 Build & Upload Binaries
    permissions:
      contents: write # Upload archives to the release

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser derives the version from tags

      - name: ⚒️ Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Builds linux / windows / darwin × amd64 / arm64 (see .goreleaser.yaml) and uploads the
      # archives and checksums.txt to the existing release, keeping its notes.
      - name: 🛠️ Build and upload
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
